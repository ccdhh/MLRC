syntax = "proto3";

package proxy_proto;

// The greeting service definition.
service proxyService {
  // Sends a greeting
  rpc checkalive (CheckaliveCMD) returns (RequestResult);

  // encode and set
  rpc encodeAndSetObject(ObjectAndPlacement) returns (SetReply);
  // get and decode
  rpc decodeAndGetObject(ObjectAndPlacement) returns (GetReply);
  // degraded read
  rpc degradedRead(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2Client(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadBreakdown(DegradedReadRequest) returns (DegradedReadReply);
  rpc degradedRead2ClientBreakdown(RecoveryRequest) returns (DegradedReadReply);
  rpc degradedReadWithBlockStripeID(DegradedReadRequest) returns (GetReply);
  rpc partialDecoding(PartialDecodingRequest) returns (DegradedReadReply);
  // recovery
  rpc recovery(RecoveryRequest) returns (RecoveryReply);
  rpc recoveryBreakdown(RecoveryRequest) returns (RecoveryReply);
  rpc multipleRecovery(MultipleRecoveryRequest) returns (GetReply);
  // delete
  rpc deleteBlock(NodeAndBlock) returns (DelReply);
  // append
  rpc scheduleAppend2Datanode(AppendStripeDataPlacement) returns (SetReply);
  // get stripe
  rpc getBlocks(StripeAndBlockIDs) returns (GetReply);
}

// parity block recalculation
message locationInfo {
  int32 cluster_id = 1;
  string proxy_ip = 2;
  int32 proxy_port = 3;
  repeated string datanodeip = 4;
  repeated int32 datanodeport = 5;
  repeated string blockkeys = 6;
  repeated int32 blockids = 7;
}

message mainRecalPlan {
  bool type = 1;  // to distinguish local and global
  bool if_partial_decoding = 2;
  repeated locationInfo clusters = 3;
  repeated string p_datanodeip = 4;
  repeated int32 p_datanodeport = 5;
  repeated string p_blockkeys = 6;
  int32 k = 7;
  int32 l = 8;
  int32 g_m = 9;
  int32 block_size = 10;
  int32 encodetype = 11;
  int32 stripe_id = 12;
  int32 group_id = 13;
}

message RecalReply {
  string result = 1;
}

message helpRecalPlan {
  bool type = 1;
  bool if_partial_decoding = 2;
  string mainproxyip = 3;
  int32 mainproxyport = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  int32 block_size = 8;
  repeated int32 blockids = 9;
  int32 parity_num = 10;
  int32 k = 11;
  int32 encodetype = 12;
}

// block relocation
message blockRelocPlan {
  repeated string blocktomove = 1;
  repeated string fromdatanodeip = 2;
  repeated int32 fromdatanodeport = 3;
  repeated string todatanodeip = 4;
  repeated int32 todatanodeport = 5;
  int32 block_size = 6;
}

message blockRelocReply {
  string result = 1;
}

message AskIfSuccess {
  int32 step = 1;
}

message RepIfSuccess {
  bool ifsuccess = 1;
}

// delete
message NodeAndBlock {
  repeated string blockkeys = 1;
  repeated string datanodeip = 2;
  repeated int32 datanodeport = 3;
  int32 stripe_id = 4;
  string key = 5;
}

message DelReply {
  bool ifcommit = 1;
}

// The request message containing the user's name.
message CheckaliveCMD {
  string name = 1;
}

// The response message containing the greetings
message RequestResult {
  bool message = 1;
}

// set and get
message ObjectAndPlacement{
  string key = 1;
  int32 valuesizebyte = 2;
  int32 k = 3;
  int32 l = 4;
  int32 g_m = 5;
  int32 stripe_id = 6;
  repeated string datanodeip = 7;
  repeated int32 datanodeport = 8;
  repeated string blockkeys = 9;
  repeated int32 blockids = 10;
  int32 block_size = 11;
  int32 encode_type = 12;
  string clientip = 13;
  int32 clientport = 14;
}

// degraded read
message DegradedReadRequest{
  string clientip = 1;
  int32 clientport = 2;
  int32 failed_block_id = 3;
  int32 failed_block_stripe_id = 4;
  string failed_block_key = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
}

message PartialDecodingRequest{
  string dest_ip = 1;
  int32 dest_port = 2;
  repeated int32 source_block_ids = 3;
  repeated string source_block_keys = 4;
  repeated string source_datanode_ips = 5;
  repeated int32 source_datanode_ports = 6;
  int32 decode_num = 7;
  repeated int32 decode_factors = 8;
}

message DegradedReadReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
}

// recovery
message RecoveryRequest{
  string replaced_node_ip = 1;
  int32 replaced_node_port = 2;
  int32 failed_block_id = 3;
  string failed_block_key = 4;
  int32 cross_rack_num = 5;
  repeated string datanodeip = 6;
  repeated int32 datanodeport = 7;
  repeated string blockkeys = 8;
  repeated int32 blockids = 9;
  repeated string proxyip = 10;
  repeated int32 proxyport = 11;
  bool is_to_send_block_id = 12;
  int32 block_id_to_send = 13;
  bool glrc_ilp_recovery = 14;
  repeated int32 failed_block_ids = 15;
  repeated string failed_block_keys = 16;
  repeated string replaced_node_ips = 17;
  repeated int32 replaced_node_ports = 18;
  repeated string selected_equations = 19;
  repeated int32 selected_equation_indices = 20;
  bool glrc_ilp_phase2 = 21;
  int32 phase2_partition_id = 22;
  int32 phase2_shard_count = 23;
  int32 phase2_stripe_byte_len = 24;
  int32 phase2_shard_begin = 25;
  int32 phase2_shard_count_local = 26;
  int32 phase2_byte_off = 27;
  int32 phase2_byte_len = 28;
  bool phase2_do_write_back = 29;
  int32 phase2_exchange_epoch = 30;
  repeated string phase2_peer_proxy_ips = 31;
  repeated int32 phase2_peer_proxy_ports = 32;
  repeated int32 phase2_peer_partition_ids = 33;
  repeated int32 phase2_peer_shard_begins = 34;
  repeated int32 phase2_peer_shard_counts = 35;
  bool glrc_ilp_pipeline = 36;
  int32 pipeline_shard_count = 37;
  int32 pipeline_hub_block_id = 38;
  repeated int32 pipeline_local_direct_equation_indices = 39;
  int32 pipeline_exchange_epoch = 40;
  /** 0=hub, 1=chain_head, 2=hop_server, 3=local_direct, 4=teardown */
  int32 pipeline_role = 41;
  int32 pipeline_chain_id = 42;
  int32 pipeline_equation_index = 43;
  int32 pipeline_eq_slot = 44;
  repeated int32 pipeline_hop_block_ids = 45;
  repeated string pipeline_hop_proxy_ips = 46;
  repeated int32 pipeline_hop_proxy_ports = 47;
  repeated string pipeline_hop_datanode_ips = 48;
  repeated int32 pipeline_hop_datanode_ports = 49;
  repeated string pipeline_hop_block_keys = 50;
  repeated int32 pipeline_hop_coefs = 51;
  int32 pipeline_my_hop_index = 52;
  string pipeline_hub_proxy_ip = 53;
  int32 pipeline_hub_proxy_port = 54;
  int32 pipeline_local_failed_block_id = 55;
  string pipeline_local_failed_block_key = 56;
  string pipeline_local_replaced_node_ip = 57;
  int32 pipeline_local_replaced_node_port = 58;
  repeated int32 pipeline_hub_chain_eq_slots = 59;
  repeated int32 pipeline_hub_is_chain_tail_flags = 60;
  repeated int32 pipeline_hub_chain_hub_coefs = 61;
  string pipeline_hub_block_key = 62;
  int32 pipeline_chain_hub_is_tail_flag = 63;
  int32 pipeline_equation_is_local = 64;
  repeated int32 pipeline_hub_chain_equation_is_local = 65;
  repeated int32 pipeline_hub_chain_local_only_flags = 66;
  /** Coordinator-assigned TCP listen ports (avoid hash collisions). */
  repeated int32 pipeline_hop_listen_ports = 67;
  int32 pipeline_my_listen_port = 68;
  int32 pipeline_chain_hub_listen_port = 69;
  repeated int32 pipeline_hub_listener_ports = 70;
  /** Global shard index of first pipeline half-shard (hybrid lower region). */
  int32 pipeline_shard_global_begin = 71;
  /** Total stripe shard count S (stripe_len = block_size / S). 0 = same as pipeline_shard_count. */
  int32 pipeline_global_shard_count = 72;
  /** Hybrid: phase2 half shares this proxy's node ingress/egress with concurrent pipeline RPCs. */
  bool phase2_share_proxy_node_bandwidth = 73;
}

message MultipleRecoveryRequest{
  string replacing_node_ip = 1;
  int32 replacing_node_port = 2;
  repeated int32 failed_block_ids = 3;
  repeated string failed_block_keys = 4;
  int32 cross_rack_num = 5;
}

message RecoveryReply {
  double disk_io_start_time = 1;
  double disk_io_end_time = 2;
  double network_start_time = 3;
  double network_end_time = 4;
  double decode_start_time = 5;
  double decode_end_time = 6;
  double cross_rack_time = 7;
  double cross_rack_xor_time = 8;
  double grpc_start_time = 9;
  double data_node_grpc_notify_time = 10;
  double data_node_grpc_start_time = 11;
  double dest_data_node_network_time = 12;
  double dest_data_node_disk_io_time = 13;
  
}

// append
message AppendStripeDataPlacement{
  string key = 1;
  int32 cluster_id = 2;
  int32 stripe_id = 3;
  // sum of all append slices within the cluster
  uint64 append_size = 4;
  repeated string datanodeip = 5;
  repeated int32 datanodeport = 6;
  repeated string blockkeys = 7;
  repeated int32 blockids = 8;
  // physical offset of each append slice within each block
  repeated uint64 offsets = 9;
  repeated uint64 sizes = 10;
  bool is_merge_parity = 11;
  string append_mode = 12;
  bool is_serialized = 13;
}

message SetReply {
  bool ifcommit = 1;
}
message GetReply {
  bool getsuccess = 1;
}
message StripeAndBlockIDs{
  int32 stripe_id = 1;
  int32 group_id = 2;
  string clientip = 3;
  int32 clientport = 4;
  repeated int32 block_ids = 5;
  repeated string block_keys = 6;
  repeated string datanodeips = 7;
  repeated int32 datanodeports = 8;
}
